<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

  <title>HomeWork Ajax</title>
</head>
<body>
  <div class="mainContainer">
    <h1>Info amigos</h1>
    <div class="searchContainer">
      <input id='input' placeholder='Amigo ID'></input>
      <button id='search'>Buscar amigo</button>
      <span id='amigo'></span>
    </div>
    <div class="deleteContainer">
      <input id='inputDelete' placeholder='Amigo ID'></input>
      <button id='delete'>Eliminar amigo</button>
      <span id='success'></span>
    </div>
    <div class="listContainer">
      <button id='boton'>Ver lista de amigos</button>
      <ul id='lista'>
      </ul>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
